[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magi-decision"
version = "0.1.0"
description = "Multi-perspective decision engine for Codex workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
magi = "magi_decision.cli:main"

[tool.setuptools]
py-modules = ["magi", "magi_core"]
packages = ["magi_decision"]
