name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run mock CLI
        run: python magi.py examples/decision.json --mock
      - name: Run packaged CLI
        run: uv run magi examples/decision.json --mock
